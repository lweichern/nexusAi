<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0099b8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  <!-- Grid lines -->
  <g stroke="#222" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="80" x2="600" y2="80"/><line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/><line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
  </g>
  <!-- Candlestick chart -->
  <g stroke="url(#accent1)" stroke-width="2" fill="none">
    <polyline points="60,280 120,220 180,250 240,180 300,160 360,120 420,140 480,90 540,70" stroke-width="2.5"/>
  </g>
  <g fill="#00d4ff" opacity="0.3">
    <circle cx="60" cy="280" r="4"/><circle cx="120" cy="220" r="4"/><circle cx="180" cy="250" r="4"/>
    <circle cx="240" cy="180" r="4"/><circle cx="300" cy="160" r="4"/><circle cx="360" cy="120" r="4"/>
    <circle cx="420" cy="140" r="4"/><circle cx="480" cy="90" r="4"/><circle cx="540" cy="70" r="4"/>
  </g>
  <!-- Neural network nodes -->
  <g fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.4">
    <circle cx="150" cy="320" r="20"/><circle cx="300" cy="340" r="15"/><circle cx="450" cy="310" r="25"/>
    <line x1="170" y1="320" x2="285" y2="340"/><line x1="315" y1="340" x2="425" y2="310"/>
  </g>
  <text x="300" y="200" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" opacity="0.6">NeuralTrade</text>
</svg>
