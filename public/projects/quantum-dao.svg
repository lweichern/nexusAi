<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#100a12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg8)"/>
  <!-- Central governance hub -->
  <circle cx="300" cy="190" r="50" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="300" cy="190" r="30" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <!-- DAO text in center -->
  <text x="300" y="195" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="16" opacity="0.5">DAO</text>
  <!-- Spoke nodes -->
  <g fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
    <circle cx="160" cy="100" r="25"/><circle cx="440" cy="100" r="25"/>
    <circle cx="120" cy="260" r="25"/><circle cx="480" cy="260" r="25"/>
    <circle cx="300" cy="330" r="25"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#00d4ff" stroke-width="0.8" opacity="0.3">
    <line x1="260" y1="160" x2="185" y2="115"/><line x1="340" y1="160" x2="415" y2="115"/>
    <line x1="260" y1="220" x2="145" y2="245"/><line x1="340" y1="220" x2="455" y2="245"/>
    <line x1="300" y1="240" x2="300" y2="305"/>
  </g>
  <!-- Voter icons in spoke nodes -->
  <g fill="#333" font-family="monospace" font-size="8" text-anchor="middle">
    <text x="160" y="103">Vote</text><text x="440" y="103">Vote</text>
    <text x="120" y="263">Vote</text><text x="480" y="263">Vote</text>
    <text x="300" y="333">Vote</text>
  </g>
  <!-- Floating proposal markers -->
  <g fill="#00d4ff" opacity="0.2">
    <rect x="200" y="60" width="50" height="6" rx="3"/><rect x="350" y="70" width="40" height="6" rx="3"/>
    <rect x="160" y="340" width="45" height="6" rx="3"/><rect x="400" y="330" width="55" height="6" rx="3"/>
  </g>
  <text x="300" y="385" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14" opacity="0.6">QuantumDAO</text>
</svg>
